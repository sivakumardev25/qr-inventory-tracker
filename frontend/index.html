<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- ── PWA / Mobile Critical ───────────────────────────────────────────── -->
  <!-- Prevent zoom, fit to device width, respect notch/safe areas          -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
             user-scalable=no, viewport-fit=cover" />

  <!-- Android Chrome — makes browser UI match app theme color -->
  <meta name="theme-color" content="#00d4aa" />

  <!-- Makes app launch in standalone (no browser chrome) when installed -->
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- iOS Safari compatibility (also works in some Android browsers) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="QRTrack" />

  <meta name="description" content="Scan QR codes and track product inventory in real-time" />

  <title>QRTrack — Product Scanner</title>

  <!-- ── Icons (used by Android when adding to home screen) ──────────────── -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <!-- ── Fonts (preconnect = faster load) ────────────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- ── jsQR — QR decoding library (loaded from CDN) ───────────────────── -->
  <!--
    jsQR is a pure JS QR decoder that works with raw pixel data from a canvas.
    We load it from CDN here so it's available globally as window.jsQR
    CDN: https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js
    NPM alternative: npm install jsqr  (then: import jsQR from 'jsqr')
  -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>

  <style>
    /* Prevent rubber-band scroll on Android WebView */
    html, body {
      overscroll-behavior: none;
      overflow: hidden;
      height: 100%;
      width: 100%;
      background: #0a0e1a;
    }
    #root {
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- ── PWA Install Prompt Handler ──────────────────────────────────────── -->
  <script>
    let deferredInstallPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      window.dispatchEvent(new CustomEvent('pwaInstallReady'));
    });

    window.triggerInstall = async () => {
      if (!deferredInstallPrompt) return false;
      deferredInstallPrompt.prompt();
      const { outcome } = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      return outcome === 'accepted';
    };

    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      window.dispatchEvent(new CustomEvent('pwaInstalled'));
    });
  </script>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
